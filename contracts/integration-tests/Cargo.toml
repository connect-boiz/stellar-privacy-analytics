[package]
name = "integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cross-contract integration tests for the Soroban contract suite (auth spoofing + init auth)"

[lib]
crate-type = ["rlib"]

[dependencies]
admin = { path = "../admin" }
access-control = { path = "../access-control" }
onchain-aggregator = { path = "../onchain-aggregator" }
privacy-oracle = { path = "../privacy-oracle" }
schema-enforcer = { path = "../schema-enforcer" }
stellar-analytics = { path = "../stellar-analytics" }
ttl-storage = { path = "../ttl-storage" }
upgradeable-proxy = { path = "../upgradeable-proxy" }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
