[workspace]
resolver = "2"
members = [
    "admin",
    "access-control",
    "invariant-testing",
    "onchain-aggregator",
    "privacy-oracle",
    "schema-enforcer",
    "stellar-analytics",
    "ttl-storage",
    "upgradeable-proxy",
    "integration-tests",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/connect-boiz/stellar-privacy-analytics"
authors = ["Stellar Team <team@stellar-ecosystem.com>"]

[workspace.dependencies]
soroban-sdk = "22.0.0"

# Needed by soroban-sdk's testutils (ed25519-dalek 2.x) — a `[patch]` table in
# the workspace root manifest applies to every member crate.
[patch.crates-io]
ed25519-dalek = { git = "https://github.com/dalek-cryptography/curve25519-dalek", tag = "ed25519-2.2.0" }

# Shared release settings for the wasm artifacts (cargo forces panic=unwind
# for test/bench profiles, so `cargo test --release` keeps working).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.release-with-overflow]
inherits = "release"
overflow-checks = true
