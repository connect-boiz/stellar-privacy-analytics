# ─────────────────────────────────────────────────────────────
#  Stellar Privacy Analytics — CI/CD Pipeline
#  All jobs run on every push/PR to ensure full coverage.
# ─────────────────────────────────────────────────────────────
name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  RUST_VERSION: '1.88.0'
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Shared library ────────────────────────────────────────
  shared:
    name: Shared Library
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: shared/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - name: Cache shared dist
        uses: actions/cache@v4
        with:
          path: shared/dist
          key: shared-dist-${{ hashFiles('shared/src/**/*.ts', 'shared/tsconfig.json') }}

  # ── Frontend: lint, type-check, test, build ───────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Restore shared dist cache
        id: shared-cache
        uses: actions/cache@v4
        with:
          path: shared/dist
          key: shared-dist-${{ hashFiles('shared/src/**/*.ts', 'shared/tsconfig.json') }}
      - name: Build shared from source (cache miss)
        if: steps.shared-cache.outputs.cache-hit != 'true'
        run: npm ci && npm run build
        working-directory: shared
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  # ── Backend: lint, type-check, test, build ────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Restore shared dist cache
        id: shared-cache
        uses: actions/cache@v4
        with:
          path: shared/dist
          key: shared-dist-${{ hashFiles('shared/src/**/*.ts', 'shared/tsconfig.json') }}
      - name: Build shared from source (cache miss)
        if: steps.shared-cache.outputs.cache-hit != 'true'
        run: npm ci && npm run build
        working-directory: shared
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - name: Security grep gates (WS1/WS2/WS5)
        run: |
          # WS1: no process.env.JWT_SECRET fallback to a hardcoded *string
          # literal* anywhere in backend/src. Referencing the centralized
          # DEV_JWT_SECRET constant (utils/secrets) is allowed.
          if grep -rnE 'process\.env\.JWT_SECRET\s*\|\|\s*"' src/ ; then
            echo "::error::Hardcoded JWT_SECRET literal fallback found (issue #413 WS1)"
            exit 1
          fi
          # WS2: no hardcoded secret fallback values in || chains (the issue
          # names default-master-key, default-key, change-me-in-production and
          # the DB password "password"; "postgres" as a DB *username* default
          # is allowed).
          if grep -rnE '\|\|\s*"(default-master-key|default-key|change-me-in-production|password)"' src/ ; then
            echo "::error::Hardcoded secret fallback found (issue #413 WS2)"
            exit 1
          fi
          # WS2: known dev literals may only appear in the centralized
          # utils/secrets.ts and the env.ts KNOWN_DEV_SECRETS registry.
          if grep -rn --include='*.ts' -E '(default-master-key-32-chars|default-signature-key|dev-only-jwt-secret|dev-only-32-byte-master-key)' src/ \
            | grep -vE 'src/(utils/secrets\.ts|config/env\.ts)' ; then
            echo "::error::Dev secret literal used outside the centralized registry (issue #413 WS2)"
            exit 1
          fi
          # WS5: the emergency bypass literal may only exist in the registry,
          # never as an active default in the rate limiter.
          if grep -rn --include='*.ts' 'emergency-bypass-2024' src/ \
            | grep -v 'src/config/env.ts' ; then
            echo "::error::Public rate-limit bypass key present outside registry (issue #413 WS5)"
            exit 1
          fi
      - name: Auth-coverage test (WS1)
        run: npx jest src/__tests__/auth-route-coverage.test.ts --forceExit

  # ── Root Soroban Extras ──────────────────────────────────
  rust-extras:
    name: Rust Extras
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-on-failure: true
      - name: Format check
        run: cargo fmt --check --manifest-path Cargo.toml
      - name: Clippy
        run: cargo clippy --lib --bins --manifest-path Cargo.toml -- -D warnings
      - name: Test
        continue-on-error: true
        run: cargo test --manifest-path Cargo.toml
      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release --manifest-path Cargo.toml

  # ── Contracts (Soroban Smart Contracts) ──────────────────
  contracts-rust:
    name: Contracts (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
          cache-on-failure: true
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --lib --bins -- -D warnings
      - name: Test
        run: cargo test
      - name: Test (release)
        run: cargo test --release
      - name: Security grep gates (WS1/WS3/WS5)
        run: |
          # WS1: no `env.current_contract_address()` in actor position. Doc
          # comments describing the removed pattern are allowed.
          if grep -rn "env\.current_contract_address()" --include="*.rs" . \
            | grep -vE ":[0-9]+:[[:space:]]*(//|///)"; then
            echo "::error::env.current_contract_address() found in actor position (issue #412 WS1)"
            exit 1
          fi
          # WS3: no unbounded whole-map instance-storage keys in the audited
          # contracts (per-user budgets/deposits/permissions must use
          # per-actor keys, e.g. `(Symbol, Address)`).
          if grep -rnE '"(user_budget|user_deposits|USER_PERMISSIONS|ACCESS_KEYS)"' \
            --include="*.rs" . ; then
            echo "::error::whole-map instance-storage key found (issue #412 WS3)"
            exit 1
          fi
      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release

  # ── Backend Rust (Monitoring Service) ─────────────────────
  backend-rust:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release

  # ── Service Discovery Dashboard ──────────────────────────
  service-discovery:
    name: Service Discovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: service-discovery-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: service-discovery-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build

  # ── Documentation ────────────────────────────────────────
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

